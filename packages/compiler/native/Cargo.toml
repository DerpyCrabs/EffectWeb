[package]
name = "effectweb_compiler"
version = "0.15.0"
edition = "2024"
rust-version = "1.97"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc = { version = "=0.156.0", features = ["semantic", "codegen", "ast_visit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
oxc_sourcemap = "=9.0.0"
napi = { version = "3.16.0", default-features = false, features = ["napi8"] }
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = "thin"
strip = "symbols"
