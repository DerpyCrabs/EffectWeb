[package]
name = "effectweb_compiler"
version = "0.9.0"
edition = "2024"
rust-version = "1.96"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc = { version = "=0.152.0", features = ["semantic", "codegen", "ast_visit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oxc_sourcemap = "=9.0.0"
napi = { version = "3.13.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.9"

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
lto = "thin"
strip = "symbols"
