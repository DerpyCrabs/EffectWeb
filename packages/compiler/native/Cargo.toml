[package]
name = "effectweb_compiler"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc = { version = "=0.148.0", features = ["semantic", "codegen", "ast_visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc_sourcemap = "=8.1.2"
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
strip = "symbols"
